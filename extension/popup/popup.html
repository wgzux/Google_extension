<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Redmine Helper</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="../images/icon.png" alt="icon" class="logo">
            <h1>Redmine Helper</h1>
            <span class="version">v3.0.0</span>
        </div>

        <div class="toggle-container">
            <div class="toggle-info">
                <span class="title">Tính năng Tooltip</span>
                <span class="desc" id="toggle-desc">Tự động hiển thị khi hover chuột</span>
            </div>
            <label class="switch">
                <input type="checkbox" id="toggle-tooltip" checked>
                <span class="slider round"></span>
            </label>
        </div>

        <div class="status-box" id="status-box">
            <span class="status-dot"></span>
            <span id="status-text">Tooltip đang BẬT</span>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
