<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Redmine Helper</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="../images/icon.png" alt="icon" class="logo">
            <h1>Redmine Helper</h1>
            <span class="version">v3.0.0</span>
        </div>

        <!-- Status indicator -->
        <div id="status-bar" class="status-bar disconnected">
            <span class="status-dot"></span>
            <span id="status-text">Chưa kết nối</span>
        </div>

        <!-- Form cấu hình -->
        <div id="config-form">
            <div class="form-group">
                <label for="redmine-url">🌐 Redmine URL</label>
                <input type="url" id="redmine-url" placeholder="http://your-redmine.com" />
            </div>

            <div class="form-group">
                <label for="api-key">🔑 API Key</label>
                <input type="password" id="api-key" placeholder="Lấy từ My Account → API access key" />
                <small><a href="#" id="show-key">Hiện</a></small>
            </div>

            <!-- Buttons -->
            <div class="btn-group">
                <button id="btn-test" class="btn btn-secondary">
                    🔍 Test
                </button>
                <button id="btn-save" class="btn btn-primary">
                    💾 Lưu
                </button>
            </div>
        </div>

        <!-- Result message -->
        <div id="message" class="message hidden"></div>

        <!-- Info khi đã kết nối -->
        <div id="user-info" class="user-info hidden">
            <div class="info-row">
                <span class="label">👤 User:</span>
                <span id="user-name">-</span>
            </div>
            <div class="info-row">
                <span class="label">🌐 Server:</span>
                <span id="server-url">-</span>
            </div>
            <button id="btn-disconnect" class="btn btn-secondary" style="margin-top: 15px; width: 100%; border-color: #e74c3c; color: #e74c3c;">
                🔌 Cấu hình lại
            </button>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
